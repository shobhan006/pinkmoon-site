name: media
on:
  push:
    branches: [media-job]
    paths: [job.json]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg jq >/dev/null && pip install -q gdown awscli
      - name: download
        if: ${{ !contains(github.event.head_commit.message, 'check') }}
        run: |
          DRIVE=$(jq -r .drive job.json)
          mkdir -p /tmp/src
          if jq -e .files job.json >/dev/null; then : > dl.log
            jq -r '.files|to_entries[]|"\(.key) \(.value)"' job.json | while read -r n id; do gdown "$id" -O "/tmp/src/JustMates Ep$n.mp4" >> dl.log 2>&1 || echo "GDOWN FAILED ep$n" >> dl.log; done
          else gdown --folder "$DRIVE" -O /tmp/src > dl.log 2>&1 || echo "GDOWN FAILED $?" >> dl.log; fi
          find /tmp/src -type f | sort >> dl.log
          cat dl.log
      - name: work
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2: ${{ secrets.R2_ENDPOINT }}
        run: if [ "$(jq -r .mode job.json)" = check ]; then bash check.sh > report.txt 2>&1; else bash work.sh; fi
      - name: report
        if: always()
        run: |
          git config user.name PINKMOON; git config user.email noreply@anthropic.com
          cat dl.log report.txt > out.txt 2>/dev/null; git add -f out.txt previews 2>/dev/null; true
          git commit -qm "media report" && git push -q || true
